name: Build and Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  build:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Use Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate and run E2E tests
        run: npm run ci
      - name: Check Sonar execution report
        run: test -s artifacts/sonar-test-execution.xml
      - name: Save reports and traces
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-results
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  sonarcloud:
    name: Run SonarCloud
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download test results
        uses: actions/download-artifact@v8.0.1
        with:
          name: playwright-results
          path: artifacts/
      - name: Check Sonar token and report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -s artifacts/sonar-test-execution.xml
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Configure SONAR_TOKEN em Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: SonarCloud Scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
